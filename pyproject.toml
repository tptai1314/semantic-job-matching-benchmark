[project]
name = "frevia"
version = "0.1.0"
description = "Frevia: multi-view LLM extraction + SBERT fusion for resume-job matching"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "cache", "results", "notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"notebooks/*" = ["E402", "F401"]

[tool.mypy]
python_version = "3.13"
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["data", "cache", "results", "notebooks", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
